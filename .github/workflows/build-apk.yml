name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform/build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          cache-provider: basic

      - name: Build debug APK (capture full log)
        id: gradle_build
        shell: bash
        run: |
          set +e
          mkdir -p dist
          gradle --no-daemon --stacktrace --warning-mode all :app:assembleDebug 2>&1 | tee dist/build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Extract useful error lines
        if: always()
        shell: bash
        run: |
          echo "## Android build diagnostics" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f dist/build.log ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            grep -nE "(^e: | error: |FAILURE:|What went wrong:|Execution failed for task|Could not resolve|Could not find|Unresolved reference|cannot find symbol|AAPT: error|Manifest merger failed)" dist/build.log | head -n 80 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build.log was not created." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Rename APK
        if: success()
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk dist/MiTVOptimizer-debug.apk
          sha256sum dist/MiTVOptimizer-debug.apk > dist/MiTVOptimizer-debug.apk.sha256

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MiTVOptimizer-debug
          path: |
            dist/MiTVOptimizer-debug.apk
            dist/MiTVOptimizer-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MiTVOptimizer-build-log
          path: dist/build.log
          if-no-files-found: warn
          retention-days: 30
